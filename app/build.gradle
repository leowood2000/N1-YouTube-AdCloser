plugins {
    id "com.android.application"
}

android {
    namespace "io.github.leowood2000.youtubetvadcloser"
    compileSdk 34

    defaultConfig {
        applicationId "io.github.leowood2000.youtubetvadcloser"
        minSdk 24
        targetSdk 28
        versionCode 5
        versionName "1.1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
